[book]
title = "mdBook 中文文档"
description = "从 Markdown 文件创建书籍。mdBook 类似于 GitBook，但是用 Rust 实现的。"
authors = ["Mathieu David", "Michael-F-Bryan"]
language = "zh-CN"
# translator= "JayMeDotDot"

[rust]
edition = "2018"

[output.html]
mathjax-support = true
site-url = "/mdBook-cn/"
git-repository-url = "https://github.com/JayMeDotDot/mdBook-cn"
edit-url-template = "https://github.com/JayMeDotDot/mdBook-cn/edit/main/{path}"
hash-files = true

[output.html.playground]
editable = true
line-numbers = true

[output.html.code.hidelines]
python = "~"

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.redirect]
"/format/config.html" = "configuration/index.html"

